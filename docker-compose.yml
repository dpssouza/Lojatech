services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lojatech}
      POSTGRES_USER: ${DB_USER:-lojatech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lojatech} -d ${DB_NAME:-lojatech}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [appnet]
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lojatech}
      DB_USER: ${DB_USER:-lojatech}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]
networks:
  appnet:
volumes:
  postgres_data:
